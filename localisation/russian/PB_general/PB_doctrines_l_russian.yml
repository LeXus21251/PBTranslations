 cat_mountaineers_doctrine: "Доктрина горно-стрелковых войск"
 cat_marines_doctrine: "Доктрина морской пехоты"
 cat_paratroopers_doctrine: "Доктрина ВДВ"
 cat_rangers_doctrine: "Доктрина рейнджеров"

 GRAND_DOCTRINE_SUPREMACY_OF_STEEL: "Превосходство стали"
 GRAND_DOCTRINE_SUPREMACY_OF_STEEL_DESC: "Моторизованная пехота и бронетанки - будущее войны. Скоростные соединения берут верх над доктриной позиционной войны времён Великой Войны, позволяя армиям переигрывать противника в маневре и перерезать его линии снабжения."
 GRAND_DOCTRINE_FIRE_AND_FURY: "Пламя и ярость"
 GRAND_DOCTRINE_FIRE_AND_FURY_DESC: "Вражеские силы могут обладать большей мобильностью; они могут быть даже умнее и хитрее нас. Но ничего не сможет обхитрить адское пламя, извергаемое стволами нашей артиллерии и крупнокалиберного орудия."
 GRAND_DOCTRINE_ARCHITECTURE_OF_WAR: "Архитектура войны"
 GRAND_DOCTRINE_ARCHITECTURE_OF_WAR_DESC: "Доктрина времён Великой Войны действительно работала - раскрытию её полного потенциала мешали лишь ограничения той эпохи и уровня технологий. Теперь, когда в нашем распоряжении есть специализированные центры планирования, ничто не мешает нам стать искусными архитекторами войны - как в наступлении, так и в обороне."
 GRAND_DOCTRINE_SUPREMACY_OF_FLESH: "Превосходство плоти"
 GRAND_DOCTRINE_SUPREMACY_OF_FLESH_DESC: "Чтобы выиграть в войне, необходимы жертвы, а именно жертвы наших бравых солдатов, которые вместе с выпущенных из наших лабораторий ордами ужасов, не поддающихся человеческому восприятию, устремятся на позиции врага."