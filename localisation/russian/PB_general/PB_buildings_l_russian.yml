# THIS FILE USE DIFFERENT ORDER FROM VANILLA, KEEP THIS IN MIND WHILE COMPARING FILES #
# USE THE SAME ORDER AS IN THE PB_buildings_l_english.yml #
# STATE BUILDINGS #
infrastructure: "Инфраструктура"
infrastructure_plural: "Инфраструктура"
infrastructure_desc: "Это сооружение позволяет улучшать инфраструктуру региона, увеличивая объем поставок и скорость перемещения ваших дивизий."
air_base: "Авиабаза"
air_base_plural: "Авиабазы"
air_base_desc: "Это сооружение позволяет размещать в регионе ваши военно-воздушные силы."
anti_air_building: "ПВО"
anti_air_building_plural: "ПВО"
anti_air_building_desc: "Это сооружение обеспечивает региону защиту от вражеских бомбардировщиков и ведет огонь по самолетам противника."
radar_station: "Радарная станция"
radar_station_plural: "Радарные станции"
radar_station_desc: "Радар предоставляет вам данные о вражеских войсках в ближайших регионах.\nЧем выше его уровень, тем больше радиус действия.\nТакже он позволяет эффективнее обнаруживать вражескую авиацию в регионе, повышая шансы на успех ваших летчиков.\nКроме того, радары улучшают обнаружение вражеских флотов."
medical_center: "Медицинский центр"
medical_center_plural: "Медицинские центры"
medical_center_desc: "Это сооружение служит современным центром снабжения медицинскими средствами, обеспечивая местных жителей необходимыми ресурсами в мирное время. В военное время оно помогает в лечении раненых военнослужащих."
research_center: "Исследовательский центр"
research_center_plural: "Исследовательские центры"
research_center_desc: "Предоставляет ученым научно-исследовательскую базу, укрепляя общенациональный научный потенциал как в гражданской, так и в военной сфере.\n\n§Y$MODIFIER_RESEARCH_SPEED_FACTOR$:§! §G+0.5%§!"
stronghold_network: "Командный центр обороны"
stronghold_network_plural: "Командные центры обороны"
stronghold_network_desc: "Обширная оборонительная система из массивных бункеров, сильно укрепленных позиций и ПВО. Предназначен для отражения атак противника и снабжения дружественных подразделений."

# SHARED BUILDINGS #
arms_factory: "Военный завод"
arms_factory_plural: "Военные заводы"
arms_factory_desc: "Это сооружение снабжает регион новой военной техникой. При необходимости его можно превратить в завод по выпуску мирной продукции."
industrial_complex: "Фабрика"
industrial_complex_plural: "Фабрики"
industrial_complex_desc: "Это сооружение снабжает регион товарами народного потребления и позволяет строить новые сооружения. При необходимости его можно превратить в завод по выпуску военной продукции."
dockyard: "Верфь"
dockyard_plural: "Верфи"
dockyard_desc: "Это сооружение снабжает регион новыми кораблями."
synthetic_refinery: Нефтеперерабатывающий завод"
synthetic_refinery_plural: "Нефтеперерабатывающие заводы"
synthetic_refinery_desc: "Сооружение, на котором из различных видов сырья производится синтетическое топливо.\n\nЭто сооружение производит в регионе:"
synthetic_refinery_amount: "$VALUE|Y0=$"
synthetic_refinery_resource: "£resources_strip|$FRAME$"
mineral_fabricator: "Минеральный синтезатор"
mineral_fabricator_plural: "Минеральные синтезаторы"
mineral_fabricator_desc: "Это сооружение позволяет производить синтетические минералы с использованием различных методов. Количество и вид продукции зависят от уровня технологического развития.\n\nЭто сооружение производит в регионе:"
mineral_fabricator_amount: "$VALUE|Y0=$"
mineral_fabricator_resource: "£resources_strip|$FRAME$"
agroponics_complex: "Аэропонный комплекс"
agroponics_complex_plural: "Аэропонные комплексы"
agroponics_complex_desc: "Комплекс, предназначенный для обеспечения страны продовольствием. На объекте предусмотрены зоны как для выращивания растений, так и для разведения животных.\n\nЭто сооружение производит в регионе:"
agroponics_complex_amount: "$VALUE|Y0=$"
agroponics_complex_resource: "£resources_strip|$FRAME$"
fuel_silo: "Топливное хранилище"
fuel_silo_plural: "Топливные хранилища"
fuel_silo_desc: "Это сооружение расширяет возможности вашего государства по хранению §Hгорючего§!."
tesla_tower: "Башня Теслы"
tesla_tower_plural: "Башни Теслы"
tesla_tower_desc: "Обеспечивает подключение к национальной сети беспроводной передачи энергии, гарантируя более надежное и эффективное энергоснабжение. Однако передаваемая системой информация уязвима для перехвата враждебными структурами."
energy_infrastructure: "Усиленная электрическая сеть"
energy_infrastructure_plural: "Усиленные электрические сети"
energy_infrastructure_desc: "Усиленные линии электроснабжения и энергетическая инфраструктура с системой многократного резервирования гарантируют, что наши заводы продолжат производство при любых обстоятельствах."
industrial_infrastructure: "Высокомощная электрическая сеть"
industrial_infrastructure_plural: "Высокомощные электрические сети"
industrial_infrastructure_desc: "Модернизация существующей гражданской энергетической инфраструктуры расширяет наши возможности для ведения промышленных операций высокой интенсивности."
mega_gun_emplacement: "Крупнокалиберная орудийная позиция"
mega_gun_emplacement_plural: "Крупнокалиберные орудийные позиции"
mega_gun_emplacement_desc: "Это крупнокалиберное орудие, работающее по принципу многокамерного метательного устройства, спроектировано для обеспечения беспрецедентной дальности стрельбы. Используя систему подземных туннелей, оно разгоняет снаряды до сверхзвуковых скоростей перед их запуском по удаленным целям."
rocket_site: "Ракетная площадка"
rocket_site_plural: "Ракетные площадки"
rocket_site_desc: "Это сооружение позволяет размещать в регионе произведенные вами ракеты."
commercial_nuclear_reactor: "Мирный ядерный реактор"
commercial_nuclear_reactor_plural: "Мирные ядерные реакторы"
commercial_nuclear_reactor_desc: "Это сооружение обеспечивает государство обогащенным ураном для производства ядерного оружия и вырабатывает электроэнергию для гражданской экономики."
nuclear_reactor: "Ядерный реактор"
nuclear_reactor_plural: "Ядерные реакторы"
nuclear_reactor_desc: "Это сооружение производит в регионе обогащенный уран для использования в атомном оружии."
nuclear_reactor_heavy_water: "Ядерный реактор на тяжелой воде"
nuclear_reactor_heavy_water_plural: "Ядерные реакторы на тяжелой воде"
nuclear_reactor_heavy_water_desc: "Это сооружение производит в регионе обогащенный уран для использования в ядерном оружии.\nЯдерные реакторы на тяжелой воде несколько дешевле графитовых аналогов, однако производят меньше сырья для ядерного оружия."

# PROVINCE BUILDINGS #
# supply node and railway in other file, unchanged
naval_base: "Морская база"
naval_base_plural: "Морские базы"
naval_base_desc: "Расширяет дальность действия вашего флота и позволяет ремонтировать его. Дает возможность выполнять поставки и экспортировать ресурсы по морю. Более высокий уровень увеличивает пропускную способность для поставок."
bunker: "Укрепление"
bunker_plural: "Укрепления"
bunker_desc: "Это сооружение накладывает штраф на атакующую сторону в сухопутном бою — $VALUE|+%0$ за каждый уровень укрепления. Атаки с разных направлений снижают эффект укреплений."
coastal_bunker: "Береговое укрепление"
coastal_bunker_plural: "Береговые укрепления"
coastal_bunker_desc: "Это сооружение накладывает штраф на атакующую сторону в морском бою — $VALUE|+%0$ за каждый уровень укрепления."
naval_headquarters: "Морской штаб"
naval_headquarters_desc: "Это сооружение позволяет вам назначать адмиралов, увеличивая таким образом эффективность §Yоперативных соединений§!, действующих в пределах досягаемости морского штаба.\n\nЧисло штабов с назначенными адмиралами не может превышать $MAX|Y$.\nВ настоящее время назначено: $CURRNUM|H$\n\nПостроить морской штаб можно только в прибрежной провинции, где есть морская база как минимум 8 уровня."

# FACILITIES #
land_facility: "Институт наземной войны"
land_facility_plural: "Институты наземной войны"
land_facility_desc: "Экспериментальные институты наземной войны позволяют запускать проекты по изучению и разработке вооружения для наземной войны — особых танков, артиллерии и т. п."
air_facility: "Институт аэродинамики и авионики"
air_facility_plural: "Институты аэродинамики и авионики"
air_facility_desc: "Экспериментальные институты по изучению аэродинамики и авионики позволяют запускать проекты, связанные с авиацией, ракетами и электроникой."
naval_facility: "Институт военно-морской техники"
naval_facility_plural: "Институты военно-морской техники"
naval_facility_desc: "Экспериментальные институты военно-морской техники позволяют запускать проекты по разработке надводных кораблей и подлодок.\nСоздать такой институт можно только в прибрежной провинции."
biochem_facility: "Институт биоинженерии и химии"
biochem_facility_plural: "Институт биоинженерии и химии"
biochem_facility_desc: "Экспериментальные институты биоинженерии и химии позволяют запускать проекты, связанные с живыми организмами, химическими соединениями и аугментацией."
nuclear_facility: "Институт ядерных исследований"
nuclear_facility_plural: "Институты ядерных исследований"
nuclear_facility_desc: "Экспериментальные институты ядерных исследований позволяют запускать проекты, где используется ядерная энергия."

# DAMS #
dam: "Плотина"
dam_plural: "Плотины"
dam_desc: "Плотины обеспечивают региону дополнительную электроэнергию, повышая эффективность промышленности и добычу ресурсов."
dam_mountain: "$dam$"
dam_mountain_plural: "$dam_plural$"
dam_mountain_desc: "$dam_desc$"
# CANALS #
canal_desc: "необходимы для полноценного функционирования канала. Их разрушение надолго ограничит возможности передвижения и транспортировки грузов."
canal_kiel: "Шлюзы Гольштейнского Канала"
canal_kiel_plural: "$canal_kiel$"
canal_kiel_desc: "$canal_kiel$ $canal_desc$."
canal_panama: "Шлюзы Никарагуанского Канала"
canal_panama_plural: "$canal_panama$"
canal_panama_desc: "$canal_panama$ $canal_desc$."
canal_australia: "Шлюзы Янсзонского Канала"
canal_australia_plural: "$canal_australia$"
canal_australia_desc: "$canal_australia$ $canal_desc$."


















