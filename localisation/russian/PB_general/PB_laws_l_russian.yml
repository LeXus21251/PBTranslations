### CIVIL LAWS ###
civilian_policies: "Гражданская политика"

## SUFFRAGE LAWS ##
suffrage_laws: "Законы о избирательных правах"

PB_universal_voting: "Всеобщее голосование"
PB_universal_voting_desc: "Каждый совершеннолетний гражданин, вне зависимости от пола, достатка или сословия, наделяется правом голосовать. Голосования открытые и состязательные, служа основой политической легитимности."
PB_biased_universal_voting: "Предвзятое всеобщее голосование"
PB_biased_universal_voting_desc: "Хотя голосование считается всеобщим, определенные группы населения либо исключаются из процесса, либо принуждаются к отказу от участия в нём."

PB_weighted_universal_voting: "Взвешенное всеобщее голосование"
PB_weighted_universal_voting_desc: "Переходная система, находящаяся между всеобщим и цензовым голосованиям. Хотя большинство граждан мужского пола могут голосовать, земельные аристократы и владельцы бизнесы обычно представлены лучше."
PB_region_dependent_voting: "Голосование в зависимости от региона"
PB_region_dependent_voting_desc: "Избирательные права зависят от локальных законов, действующих в той или иной провинции страны."
PB_wealth_voting: "Цензовое голосование"
PB_landed_voting: "Земельное цензовое голосование"

PB_monitored_voting: "Наблюдаемое голосование"

PB_single_party_system_voting: "Однопартийная система"
PB_single_party_system_voting_desc: "Единая политическая партия доминирует во всех государственных органах власти. Оппозиция запрещена, и даже если голосования и проводятся, они служат чтобы лишь поддерживать господствующую идеологию."
PB_no_voting: "Нет голосований"
PB_no_voting_desc: "Государство управляется без голосований или представительства. Вся власть сосредоточена в руках правящей клики, а население полностью исключено из политической жизни."

## PRESS LAWS ##
press_laws: "Законы о прессе"

PB_independent_free_press: "Независимая свободная пресса"
PB_independent_free_press_desc: "Газеты, журналы и радиостанции работают без государственного вмешательства. Множество голосов формируют общественный дискурс, и критика государства открыто допускается."
PB_biased_free_press: "Предвзятая свободная пресса"
PB_monopolized_press: "Монополизированная пресса"
PB_censored_press: "Подцензурная пресса"
PB_censored_press_desc: "Пресса пользуется ограниченной свободой, однако по-прежнему сталкивается с цензурой, проблемами с лицензированием и давлением со стороны властей. Обсуждение острых тем ограничено, хотя отдельные инакомыслящие голоса всё же звучат."
PB_state_controlled_press: "Государственно-контролируемая пресса"
PB_state_controlled_press_desc: "Все средства массовой информации находятся под непосредственным контролем государства или принадлежат ему. Информация фильтруется через официальные каналы, в общественном пространстве доминирует пропаганда, а инакомыслие подавляется."

## PUBLIC MEETINGS LAWS ##
public_meetings: "Законы о публичных собраниях"

PB_public_meetings_allowed: "Публичные собрания разрешены"
PB_public_meetings_allowed_desc: "Граждане могут свободно собираться, протестовать или организовываться без вмешательства правительства. Общественные площади и залы служат оживленными аренами политической и социальной жизни."
PB_public_meetings_monitored: "Публичные собрания наблюдаются"
PB_public_meetings_monitored_desc: "Собрания разрешены, но власти пристально следят за ними. Для демонстраций часто необходимо разрешение, а поблизости часто присутствуют силовики, призванные поддерживать \"порядок\"."
PB_public_meetings_banned: "Публичные собрания запрещены"
PB_public_meetings_banned_desc: "Публичные собрания запрещены законом. Любая попытка организоваться быстро пресекается властями, а коллективное политическое самовыражение загоняется в подполье."

## WOMENS RIGHTS ##
womens_rights: "Законы о правах женщин"

PB_total_gender_equality: "Тотальное равенство"
PB_total_gender_equality_desc: "Женщины пользуются полным социальным, политическим и экономическим равенством с мужчинами. Они могут голосовать, занимать государственные должности, наследовать имущество, свободно трудиться и участвовать во всех сферах общественной и частной жизни."
PB_full_gender_equality: "Полное равенство"
PB_full_gender_equality_desc: "Женщины обладают широкими правовыми и социальными правами, включая избирательное право, доступ к образованию и возможности трудоустройства, хотя на практике могут сохраняться некоторые незначительные проявления неравенства."
PB_limited_womens_rights: "Лимитированные права женщин"
PB_limited_womens_rights_desc: "Женщинам предоставляются базовые правовые гарантии, а также определенный доступ к образованию и работе, однако их политическое участие и правовая самостоятельность ограничены."
PB_no_womens_legal_protection: "Отсутствие правовой защиты"
PB_no_womens_legal_protection_desc: "Права женщин практически не имеют правового признания. Они не могут голосовать, наследовать имущество наравне с мужчинами или свободно участвовать в общественной жизни, из-за чего остаются уязвимыми перед лицом закона."
PB_patriarchal_society: "Патриархальное общество"
PB_patriarchal_society_desc: "Общество устроено на основе мужского доминирования. Женщины по большей части ограничены выполнением домашних ролей, а их правовая, социальная и экономическая независимость минимальна или вовсе отсутствует."

PB_MTA_maternal_exclusion: "Женское исключение"

## MINORITY LAWS ##
minority_rights: "Законы о правах меньшинств"

PB_minority_affirmitive_action: "Позитивная дискриминация"
PB_minority_affirmitive_action_desc: "Государственная политика обеспечивает активную поддержку меньшинств, гарантируя им равные возможности в сфере образования, занятости и политического представительства."
PB_minority_significant_autonomy: "Значительная автономия"
PB_minority_significant_autonomy_desc: "Меньшинства обладают значительным самоуправлением, включая культурную, языковую или административную автономию в рамках государства."
PB_minority_neutral_stance: "Нейтралитет"
PB_minority_neutral_stance_desc: "Меньшинства юридически признаны, однако не получают никаких особых привилегий или мер защиты, выходящих за рамки базовых гражданских прав."
PB_minority_forceful_integration: "Принудительная интеграция"
PB_minority_forceful_integration_desc: "Культуры и обычаи этнических меньшинств постепенно стираются посредством шовинистической школьной программы и принудительного расового смешения."
PB_minority_ethnic_segregation: "Этническая сегрегация"
PB_minority_ethnic_segregation_desc: "Меньшинства социально или юридически отделены от большинства; им ограничен доступ к определённым сферам, услугам или политическим правам."
PB_minority_ethnic_hierarchy: "Этническая иерархия"
PB_minority_ethnic_hierarchy_desc: "Меньшинства считают неполноценными, они сталкиваются с системной дискриминацией, и их лишают реальных прав или возможности участвовать в жизни общества."
PB_minority_ethnic_exclusivity: "Этническая эксклюзивность"
PB_minority_ethnic_exclusivity_desc: "Государство активно пытается избавиться от своих этнических меньшинств путем принудительного выселения или открытого применения насилия, стремясь таким образом достичь состояния так называемой “расовой чистоты”."

PB_minority_stellar_extermination: "Полное истребление"
PB_minority_stellar_extermination_2: "$PB_minority_stellar_extermination$"

## SECURITY SERVICES LAWS ##
security_services: "Законы о службах безопасности"

PB_community_outreach_policing: "Сотрудничество с общественностью"
PB_community_outreach_policing_desc: "Местные власти работают в тесном взаимодействии с населением, делая упор на просвещение, доверие и сотрудничество. Преступность и беспорядки предотвращаются посредством конструктивного взаимодействия, однако отсутствие жесткого контроля оставляет пространство для деятельности подпольных движений."
PB_preventative_policing: "Профилактическое обеспечение правопорядка"
PB_preventative_policing_desc: "Патрулирование и присутствие в общественности расширены, чтобы предотвращать преступления и сопротивления до того, как они укоренятся. Такой подход более жесткий, чем сотрудничество с населением, но всё равно избегает масштабные репрессии, балансируя порядок и гражданские свободы."
PB_standard_policing: "Стандартное обеспечение правопорядка"
PB_standard_policing_desc: "Обычная правоохранительная деятельность поддерживает базовый уровень порядка и безопасности. Граждан особо не поощряют, но и не притесняют, а государство применяет лишь минимально необходимую силу для поддержания контроля."
PB_state_intimidation_policing: "Государственное запугивание"
PB_state_intimidation_policing_desc: "Государство использует угрозы, принуждение и периодическую демонстрацию силы, чтобы добиться повиновения. Страх становится инструментом управления, повышая готовность к войне ценой гражданской стабильности и долгосрочной лояльности."
PB_secret_police_policing: "Тайная полиция"
PB_secret_police_policing_desc: "Обширная сеть осведомителей и тайных агентов выявляет и искореняет инакомыслие, где бы оно ни проявилось. Постоянная слежка и репрессии подавляют сопротивление, но порождают в народе глубокое недовольство."
PB_RUS_national_panopticon_policing: "Национальный паноптикум"

### ECONOMIC LAWS ###
economic_policies: "Экономическая политика"

## LABOUR LAWS ##
labour_laws: "Трудовой закон"

PB_fully_automated_factories: "Полностью автоматизированные фабрики"
PB_fully_automated_factories_desc: "Масштабная автоматизация заменяет человеческий труд машинами, что позволяет максимизировать эффективность и объемы производства, одновременно снижая потребность в традиционной рабочей силе."
PB_8_hour_workday: "Восьмичасовой рабочий день"
PB_8_hour_workday_desc: "Строго ограничивает продолжительность работы 8 часами в день, отдавая приоритет благополучию и продуктивности работников."
PB_12_hour_workday: "Двенадцатичасовой рабочий день"
PB_12_hour_workday_desc: "Умеренное регулирование, обеспечивающее баланс между экономическими результатами и отдыхом работников."
PB_14_hour_workday: "Четырнадцатичасовой рабочий день"
PB_14_hour_workday_desc: "Слабое регулирование, предпочтение отдается работодателям, при этом сохраняется определенная защита для работников."
PB_18_hour_workday: "Восемнадцатичасовой рабочий день"
PB_18_hour_workday_desc: "Регулирование минимально, работники трудятся очень долгие смены, имея при этом минимум правовой защиты."
PB_no_limit_workday: "Неопределенный рабочий день"
PB_no_limit_workday_desc: "Полный принцип невмешательства, от работников может потребоваться трудиться неопределенно долго."

## HEALTHCARE LAWS ##
healthcare: "Здравоохранительный закон"

PB_comprehensive_healthcare: "Комплексная система здравоохранения"
PB_comprehensive_healthcare_desc: "Полный доступ к медицинской помощи для всех граждан, включая профилактические мероприятия и передовые методы лечения."
PB_standard_healthcare: "Стандартная система здравоохранения"
PB_standard_healthcare_desc: "Умеренный уровень страхового покрытия, базовые виды лечения и государственные больницы широко доступны."
PB_basic_healthcare: "Базовая система здравоохранения"
PB_basic_healthcare_desc: "Минимальный объем медицинской помощи, ограниченный только самыми необходимыми услугами."
PB_no_national_healthcare: "Нет системы здравоохранения"
PB_no_national_healthcare_desc: "Государственное здравоохранение отсутствует; гражданам приходится полагаться на частные или неформальные медицинские услуги."

## EDUCATION LAWS ##
education: "Образовательный закон"

PB_subsidized_higher_education: "Субсидируемое высшее образование"
PB_subsidized_higher_education_desc: "Комплексная система образования, включающая поддержку высшего образования и обеспечивающая широкие возможности для поступления в университеты и получения углубленного образования."
PB_subsidized_basic_education: "Субсидируемое базовое образование"
PB_subsidized_basic_education_desc: "Базовое образование, поддерживаемое государством и обеспечивающее начальное и среднее школьное обучение для большинства детей."
PB_basic_education: "Базовая система образования"
PB_basic_education_desc: "Доступ к образованию ограничен, преподаются лишь основы грамотности и счета, зачастую при минимальной поддержке со стороны государства."
PB_no_official_education: "Нет официальной системы образования"
PB_no_official_education_desc: "Государство не обеспечивает организованное обучение; образование носит неформальный или частный характер, при этом для широких слоев населения доступ к нему крайне ограничен."

PB_SCA_subsidized_higher_education: "Субсидируемое высшее образование"
PB_SCA_subsidized_basic_education: "Субсидируемое базовое образование"
PB_SCA_basic_education: "Базовая система образования"

## WELFARE LAWS ##

welfare: "Закон о социальном обеспечении"

PB_generous_state_welfare: "Щедрое государственное социальное обеспечение"
PB_generous_state_welfare_desc: "Масштабные программы социальной поддержки, включающие пособия по безработице, пенсии и субсидии для малообеспеченных граждан."
PB_moderate_state_welfare: "Умеренное государственное социальное обеспечение"
PB_moderate_state_welfare_desc: "Частичная социальная поддержка, охватывающая базовые потребности, такие как пособия по безработице и ограниченные социальные выплаты."
PB_basic_state_welfare: "Базовая система социального обеспечения"
PB_basic_state_welfare_desc: "Минимальная помощь, только самое необходимое социальное обеспечение для наиболее уязвимых групп населения."
PB_no_state_welfare: "Нет государственного социального обеспечения"
PB_no_state_welfare_desc: "Система социального обеспечения отсутствует; граждане сами отвечают за свою социальную защищенность и поддержку."

