## AUGMENTATION ##
augments: "Закон о модификации тела"

PB_augmentation_no_legislation: "Нет законов о модификации тела"
PB_augmentation_no_legislation_desc: "Не существует официальных законов, регулирующих биоинженерию или модификацию тела человека. Граждане и частные организации вольны исследовать и применять технологии улучшения по своему усмотрению. Хотя инновации активно развиваются, контроль со стороны государства минимален, что приводит как к выдающимся прорывам, так и к возникновению потенциальных этических дилемм."
PB_augmentation_banned: "Модификация тел запрещена"
PB_augmentation_banned_desc: "Все виды биологического или кибернетического изменения тел строго запрещены. Исследования подавляются, процедуры запрещены, а практикующие специалисты сурово наказываются. Государство рассматривает модификацию тел как опасную, неестественную или дестабилизирующую процедуру, оставляя граждан полагаться исключительно на естественные человеческие возможности."
PB_augmentation_encouraged: "Модификация тел поощряется"
PB_augmentation_encouraged_desc: "Государство активно содействует модификации тел посредством субсидий, финансирования исследований и культурных кампаний. Процесс этот добровольный, однако граждан поощряют прибегать к усовершенствованиям ради повышения продуктивности, улучшения здоровья или роста военной эффективности. Модификация тел становится важной, общепризнанной составляющей современной идентичности."
PB_augmentation_enforced: "Принудительная модификация тел"
PB_augmentation_enforced_desc: "Биоинженерия и модификация тел становятся обязательными для определенных групп или даже для всего населения в целом. Государство навязывает эти усовершенствования ради достижения стратегических целей - военного превосходства, экономической эффективности или идеологической чистоты. Отказ от них расценивается как неповиновение, а сами тела граждан превращаются в инструменты государственной политики."
PB_SWE_augmentation_rights: "Закрепленные права о модификации тел"
