PB_NI_spanish_virtue: "Испанская добродетель"
PB_NI_spanish_virtue_desc: "\n\n\n\n\n\n\n£GFX_TT_Apostasy_to_Sanity\n\n\n\n\n\n\n\n\nМанию, охватившую Испанское общество, можно объяснить одной причиной - реакцией на травму. Всякий раз, когда испанскому народу приходится сталкиваться с войной, революцией, унижениями и пытками, нация погружается в оцепенение - она отрывается от реальности и оказывается в состоянии полного паралича. \n\nПолная паранойя охватывает её детей. Младенцев облачают в ритуальные одежды, даже не задумываясь зачем; совершаются пустые обряды, лишенные хоть какого-то смысла; по улицам день и ночь тянутся процессии, воздух пропитан удушливым ладаном, а колокола звонят для книого. При одном лишь упоминании о грехе люди падают на колени - умоляют, рыдают, взывают о милосердии, каясь в том, что, по сути, является наказанием, которое ложится на каждую душу в Испанском государстве. \n\nНе смотря на это, Испания каким-то образом живет. В её ступоре переигрываются все вторжения, все договоры, все неверные шаги, словно заново проживая бесконечные Страсти. Она ни о чём не просит, сидит неподвижно, в ожидании. \n\nИ если память об Испании - это не память о завоеваниях или империи, то это память об осуждении. Её тело может гнить в оковах, но сердце её бьётся подобно самому Священному Сердцу: окружённое терниями, объятое пламенем - и всё ещё кровоточащее."
PB_NI_prussian_fatalism: "Прусский фатализм"
PB_NI_orthodox_virtue: "Православная добродетель"
PB_NI_knights_of_teuton: "Рыцари Тевтонские"
PB_NI_american_revolutionism: "Американский революционизм"
