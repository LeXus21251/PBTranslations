canal_kiel: "Śluzy kanału Holsztyńskiego"
canal_kiel_plural: "$canal_kiel$"
canal_kiel_desc: "$canal_kiel$ $canal_desc$."
canal_panama: "Śluzy kanału Nikaraguańskiego"
